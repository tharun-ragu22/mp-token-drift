name: Token Drift

# Scans the codebase for design-token drift and publishes the results to the
# GitHub "Code scanning" tab (Security → Code scanning) as SARIF.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # required to upload SARIF results

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      # `scan:ci` writes drift-report.sarif and exits non-zero when drift exceeds
      # the budget. `continue-on-error` lets the report upload regardless so the
      # findings still surface as code-scanning alerts. Remove it to turn drift
      # into a hard build failure that blocks the PR.
      - name: Scan for token drift
        run: npm run scan:ci
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: drift-report.sarif
          category: mp-token-drift
