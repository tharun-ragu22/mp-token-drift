name: Token Drift

# Scans the codebase for design-token drift and publishes the results to the
# GitHub "Code scanning" tab (Security → Code scanning) as SARIF.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # required to upload SARIF results

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      # Generate the SARIF report. `scan:sarif` never fails the build; findings
      # surface as code-scanning alerts after upload.
      - name: Generate drift report (SARIF)
        run: npm run scan:sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: drift-report.sarif
          category: mp-token-drift

      # Optional hard gate — uncomment to fail PRs that introduce drift beyond
      # the `maxDrift` budget in drift.config.json:
      # - name: Enforce drift budget
      #   run: npm run scan:ci
